name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      CI: "true"
      PYTEST_ADDOPTS: "--reruns 2 -n 2 --junitxml=reports/junit-${{ matrix.shardIndex }}.xml"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Guard against focused tests
        run: |
          if grep -rn "mark.only" tests; then
            echo "pytest.mark.only is forbidden in CI"
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -p no:randomly --splits ${{ matrix.shardTotal }} --group ${{ matrix.shardIndex }}

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit for merge
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shardIndex }}
          path: reports/junit-${{ matrix.shardIndex }}.xml
          retention-days: 1

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install junitparser junit2html

      - uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: junit-*
          merge-multiple: true

      - name: Merge
        run: |
          mkdir -p merged
          junitparser merge --glob "all-reports/junit-*.xml" merged/junit-merged.xml
          junit2html merged/junit-merged.xml merged/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: merged/index.html
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: merged/junit-merged.xml
          retention-days: 14